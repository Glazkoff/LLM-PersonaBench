# Model slate for Paper B. slug = hf_id with '/'->'_' and '.'->'p'.
# readout: belief_vllm (logprobs via local vLLM), belief_hf (forward pass), sampled (API, k samples)
# prefill: assistant-turn prefill used by the belief readout
# tier: 1 = full optimizer grid, 2 = GA+GEPA+baselines, 3 = API frontier (sampled readout)
# gate: minimum mean mass on the five answer tokens required in preflight (PREREGISTRATION §2)
defaults:
  dtype: bf16
  tp: 1
  readout: belief_vllm
  prefill: "My answer is "
  gate_mass_on_scale: 0.5
  max_model_len: 8192
  gpu_memory_utilization: 0.90

models:
  - hf_id: Qwen/Qwen3.6-35B-A3B
    slug: Qwen_Qwen3p6-35B-A3B
    released: 2026-04
    tier: 1
    pilot: true
